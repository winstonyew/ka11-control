name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pillow pytest
      # The UI tests skip themselves on CI (Tk is flaky on hosted runners); the protocol,
      # volume-safety and settings tests run everywhere.
      - run: python -m pytest tests -v
